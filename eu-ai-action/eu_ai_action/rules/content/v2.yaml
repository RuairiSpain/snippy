- id: AIA-27-FRIA
  regulation: EU AI Act
  article: "Art. 27"
  applies_from: 2027-12-02
  role: deployer
  version: 1
  applies_when:
    all:
      - any:
          - {fact: input.risk_tier, op: eq, value: high}
          - all:
              - {fact: input.risk_tier, op: missing}
              - {fact: suggestedAnnexIII, op: exists}
      - any:
          - {fact: org.is_public_body, op: eq, value: "yes"}
          - {fact: org.provides_public_services, op: eq, value: "yes"}
          - {fact: org.credit_or_insurance_pricing, op: eq, value: "yes"}
  check: null
  evidence: [affectedGroups, overseers, evaluations]
  document: fria
  source_citation: "Regulation (EU) 2024/1689, Art. 27"
  reviewed_by: ""

