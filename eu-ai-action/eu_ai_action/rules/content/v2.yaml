- id: AIA-50-2-MARKING
  regulation: EU AI Act
  article: "Art. 50(2)"
  applies_from: 2026-12-02
  role: provider
  version: 1
  # No model evidence means the question is open, not answered "no": the duty applies with an unknown result.
  applies_when:
    any:
      - {fact: generatesSyntheticContent, op: eq, value: true}
      - {fact: generatesSyntheticContent, op: missing}
  check:
    unknown_when:
      - {fact: contentMarking, op: missing}
    pass_when:
      - {fact: contentMarking, op: eq, value: true}
  evidence: [syntheticContentTypes, modelDeployments, contentMarking]
  document: synthetic-content-marking-check
  source_citation: "Regulation (EU) 2024/1689, Art. 50(2)"
  reviewed_by: ""

