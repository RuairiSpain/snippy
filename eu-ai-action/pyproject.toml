[project]
name = "eu-ai-action"
version = "0.1.0"
description = "Turns Microsoft agent evidence into EU AI Act and GDPR compliance documents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
