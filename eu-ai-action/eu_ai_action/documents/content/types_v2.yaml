    - {name: overseers, source: fact, key: overseers}
    - {name: stakeholders, source: human, label: {en: "Stakeholders and affected parties"}}
    - {name: potential_impacts, source: human, label: {en: "Potential impacts on individuals, groups and society"}}
    - {name: impact_controls, source: human, label: {en: "Controls and treatment of the impacts"}}
  layout:
    - title: {en: "System", es: "Sistema"}
      rows:
        - {label: {en: "Agent", es: "Agente"}, field: agent_name}
        - {label: {en: "Risk tier", es: "Nivel de riesgo"}, field: risk_tier}
        - {label: {en: "Evaluation evidence", es: "Evidencia de evaluación"}, field: evaluations}
        - {label: {en: "Human oversight (observed)", es: "Supervisión humana (observada)"}, field: overseers}
    - title: {en: "Impact assessment", es: "Evaluación de impacto"}
      rows:
        - {label: {en: "Stakeholders", es: "Partes interesadas"}, field: stakeholders}
