    es: "ISO/IEC 42001, anexo A. La correspondencia es una decisión del responsable del sistema de gestión."

- id: aesia-incident-notice
  rule: ES-AESIA-INCIDENT
  template_reviewed_by: ""
  titles: {en: "Incident notice for AESIA (Art. 73, Spain)", es: "Notificación de incidente para la AESIA (art. 73, España)"}
  fields:
    - {name: agent_name, source: fact, key: name}
    - {name: incident_id, source: incident, key: id}
    - {name: incident_title, source: incident, key: title}
    - {name: detected_time, source: incident, key: detectedTime}
    - {name: incident_description, source: incident, key: description}
    - {name: general_deadline, source: deadline, key: detectedTime, hours: 360}
    - {name: controller_name, source: human, label: {en: "Organisation name"}}
    - {name: provider_contact, source: human, label: {en: "Provider of the AI system (name and contact)"}}
    - {name: submission_reference, source: human, label: {en: "AESIA submission reference, once filed"}}
  layout:
    - title: {en: "Notice", es: "Notificación"}
      rows:
        - {label: {en: "Organisation", es: "Organización"}, field: controller_name}
        - {label: {en: "Provider", es: "Proveedor"}, field: provider_contact}
        - {label: {en: "Incident", es: "Incidente"}, field: incident_id}
        - {label: {en: "Title", es: "Título"}, field: incident_title}
        - {label: {en: "System", es: "Sistema"}, field: agent_name}
        - {label: {en: "Detected", es: "Detectado"}, field: detected_time}
        - {label: {en: "General time limit (15 days after awareness, counsel to confirm)", es: "Plazo general (15 días desde el conocimiento, a confirmar por el asesor jurídico)"}, field: general_deadline}
