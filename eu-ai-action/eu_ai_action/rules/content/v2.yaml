# v2 rules. Counsel review required before release (reviewed_by empty).
- id: AIA-79-RISK-NOTICE
  regulation: EU AI Act
  article: "Art. 26(5), Art. 79"
  applies_from: 2027-12-02
  role: deployer
  version: 1
  per: incident
  applies_when:
    all:
      - {fact: incident.severity, op: in, value: [high, critical]}
  check: null
  evidence: [incidents]
  document: risk-notice-suspension
  source_citation: "Regulation (EU) 2024/1689, Arts. 26(5) and 79"
  reviewed_by: ""

