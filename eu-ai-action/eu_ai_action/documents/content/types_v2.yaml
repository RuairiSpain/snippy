    en: "Regulation (EU) 2024/1689, Article 73, for notification to the Spanish supervisory authority (AESIA). The national form and channel must be checked with AESIA before use: this layout is not an official form."
    es: "Reglamento (UE) 2024/1689, artículo 73, para la notificación a la autoridad de supervisión española (AESIA). El formulario y el canal nacionales deben comprobarse con la AESIA antes de su uso: esta estructura no es un formulario oficial."

