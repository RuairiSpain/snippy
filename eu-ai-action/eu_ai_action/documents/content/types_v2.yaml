    es: "Directiva (UE) 2022/2555 (NIS2), artículo 21.2, según su transposición nacional."

- id: nis2-incident-report
  rule: NIS2-23-INCIDENT
  template_reviewed_by: ""
  titles: {en: "NIS2 significant incident notifications (Art. 23)", es: "Notificaciones de incidente significativo (NIS2, art. 23)"}
  fields:
    - {name: agent_name, source: fact, key: name}
    - {name: incident_id, source: incident, key: id}
    - {name: incident_title, source: incident, key: title}
    - {name: detected_time, source: incident, key: detectedTime}
    - {name: incident_description, source: incident, key: description}
    - {name: early_warning, source: deadline, key: detectedTime, hours: 24}
    - {name: notification, source: deadline, key: detectedTime, hours: 72}
    - {name: final_report, source: deadline, key: detectedTime, hours: 720}
    - {name: initial_assessment, source: human, label: {en: "Initial assessment: severity, impact, indicators of compromise"}}
    - {name: cross_border_impact, source: human, label: {en: "Suspected unlawful or malicious cause; cross-border impact"}}
    - {name: root_cause, source: human, label: {en: "Root cause and mitigation"}}
  layout:
    - title: {en: "Incident", es: "Incidente"}
      rows:
        - {label: {en: "Incident", es: "Incidente"}, field: incident_id}
        - {label: {en: "Title", es: "Título"}, field: incident_title}
        - {label: {en: "Agent", es: "Agente"}, field: agent_name}
        - {label: {en: "Detected (awareness time to be confirmed)", es: "Detectado (momento de conocimiento por confirmar)"}, field: detected_time}
        - {label: {en: "Facts known", es: "Hechos conocidos"}, field: incident_description}
    - title: {en: "Reporting clock", es: "Calendario de notificación"}
      rows:
        - {label: {en: "Early warning (24 hours)", es: "Alerta temprana (24 horas)"}, field: early_warning}
        - {label: {en: "Incident notification (72 hours)", es: "Notificación del incidente (72 horas)"}, field: notification}
        - {label: {en: "Final report (about 1 month, 30 days used here)", es: "Informe final (aprox. 1 mes, aquí 30 días)"}, field: final_report}
    - title: {en: "Assessment", es: "Evaluación"}
      rows:
        - {label: {en: "Initial assessment", es: "Evaluación inicial"}, field: initial_assessment}
        - {label: {en: "Cause and cross-border impact", es: "Causa e impacto transfronterizo"}, field: cross_border_impact}
        - {label: {en: "Root cause and mitigation", es: "Causa raíz y mitigación"}, field: root_cause}
  basis:
    en: "Directive (EU) 2022/2555 (NIS2), Article 23, as transposed nationally. Confirm the national authority and its reporting channel."
    es: "Directiva (UE) 2022/2555 (NIS2), artículo 23, según su transposición nacional. Confirmar la autoridad nacional y su canal de notificación."

- id: iso42001-impact-assessment
