# Copy to config.yaml and point SANDBOX_MUX_CONFIG at it. The same variables can live in a
# .env file in the working directory (or SANDBOX_MUX_ENV_FILE); real environment variables win.
# Any setting can be overridden from the environment (environment wins over this file):
#   SANDBOX_MUX_IDLE_TIMEOUT_SECONDS    pool.auto_suspend_seconds   suspend an idle sandbox
#   SANDBOX_MUX_SESSION_TTL_SECONDS     session.user_idle_ttl_seconds   remove an idle user's session
#   SANDBOX_MUX_EMPTY_SANDBOX_TTL_SECONDS  pool.empty_ttl_seconds   delete an empty sandbox
#   SANDBOX_MUX_HISTORY_TTL_SECONDS, _TURN_TIMEOUT_SECONDS, _QUEUE_TIMEOUT_SECONDS,
#   SANDBOX_MUX_MIN_SANDBOXES, _MAX_SANDBOXES, _USERS_PER_SANDBOX
#   SANDBOX_MUX_CPU, _MEMORY, _DISK_SIZE   size of each sandbox
#   SANDBOX_MUX_CONNECTORS (comma separated names or IDs), _CONNECTOR_RETIRE_GRACE_SECONDS
#   SANDBOX_MUX_FILES_ENABLED, _MAX_FILE_SIZE, _MAX_USER_STORAGE, _FILE_RETENTION_DAYS   file storage
#   SANDBOX_MUX_LIMITS_MODE, _USER_CPU, _USER_MEMORY, _USER_PIDS   per-user limits
#   SANDBOX_MUX_EGRESS_MODE, _EGRESS_ALLOW_HOSTS (comma separated)   outbound network policy
#   SANDBOX_MUX__<SECTION>__<KEY>       anything else, e.g. SANDBOX_MUX__POOL__STRATEGY=spread
#
# Secrets do not belong here. Redis credentials come from the REDIS_URL
# environment variable (redis.url below is only a fallback for local dev).

azure:
  subscription_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "my-rg"
  sandbox_group: "my-sandbox-group"
  region: "westus2"            # used to build the data-plane endpoint
  # endpoint: "https://..."    # optional override of the regional endpoint

backend: azure                 # azure | fake (fake is in-memory, for local dev)

pool:
  name: agents                 # label value; lets several pools share one sandbox group
  min_sandboxes: 0             # kept warm even when empty
  max_sandboxes: 5             # hard cap across ALL replicas of this service
  users_per_sandbox: 10        # hard cap on users bound to one sandbox
  strategy: pack               # pack = fill fullest sandbox first (cheapest)
                               # spread = least loaded first (lowest contention)
  disk: ubuntu                 # public image name (python-3.12, node-24, ...)   env: SANDBOX_MUX_DISK
  # disk_id: "..."             # your own image from `python -m sandbox_mux.image build`   env: SANDBOX_MUX_DISK_ID
  # entrypoint: ["sleep"]      # only if the image's own command exits immediately
  # cmd: ["infinity"]
  # warmup_command: ["python3", "-c", "import numpy, pandas"]   # run once per new sandbox, as root
  # warmup_timeout_seconds: 120
  # min_free_slots: 0          # keep this many free user slots booted ahead of demand   env: SANDBOX_MUX_MIN_FREE_SLOTS
  cpu: "2000m"                 # per sandbox, shared by its users (env: SANDBOX_MUX_CPU)
  memory: "4096Mi"             # per sandbox (env: SANDBOX_MUX_MEMORY)
  # disk_size: "20Gi"          # per sandbox (env: SANDBOX_MUX_DISK_SIZE)
  auto_suspend_seconds: 900    # platform suspends a sandbox after this much inactivity
  auto_suspend_mode: Memory    # Memory | Disk
  create_timeout_seconds: 300
  empty_ttl_seconds: 600       # delete a sandbox with no users after this long (above min)
  egress:                      # outbound network policy for every sandbox in this pool
    mode: disabled             # disabled (deny all) | allowlist | enabled (allow all) | platform_default
    # allow_hosts: ["api.openai.azure.com", "*.graph.microsoft.com"]   # allowlist mode only
    # audit_only: false        # log decisions without blocking (to build an allowlist)
    # traffic_inspection: Full # Legacy | Partial | Full | None (service default when unset)
    # block_non_http: false    # also deny raw TCP/UDP. Verify HTTPS still works before enabling

session:
  turn_timeout_seconds: 120
  queue_timeout_seconds: 30    # how long a request waits for capacity before HTTP 429
  user_idle_ttl_seconds: 3600  # unbind the user and delete their home after this long idle
  max_history_messages: 40     # messages sent to the agent per turn
  history_ttl_seconds: 604800
  max_prompt_chars: 32000

limits:                        # per-user ceilings inside a shared sandbox (not reservations)
  mode: none                   # none | cgroup | ulimit
  # cpu: 1                     # cores (cgroup only)       env: SANDBOX_MUX_USER_CPU
  # memory: 1Gi                # hard cap, no swap          env: SANDBOX_MUX_USER_MEMORY
  # pids: 256                  # processes and threads      env: SANDBOX_MUX_USER_PIDS
  # Size so that users_per_sandbox x limit is at most the sandbox size (pool.cpu, pool.memory).

connectors:                    # connectors / MCP servers every sandbox in the pool starts with
  # Each must already be attached to the sandbox group:  aca sandboxgroup connector add --connection-id <id> --authorization system
  available:                   # optional names for the long resource IDs
    sharepoint: /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Web/connectorGateways/<ns>/mcpserverconfigs/office365Mcp
    github:     /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Web/connectorGateways/<ns>/mcpserverconfigs/github
  attach: []                   # names from `available` or full resource IDs, at most 10   env: SANDBOX_MUX_CONNECTORS=sharepoint,github
  # config_file: /root/.copilot/mcp-config.json   # where the platform writes the MCP client config in the sandbox
  retire_grace_seconds: 3600   # after the list changes, old sandboxes are deleted once empty or after this long

files:                         # upload inputs, download outputs; stored outside the sandboxes
  enabled: false               # needs isolation.mode: unix_user
  store: azure_blob            # azure_blob | local (local is for development)
  account_url: "https://mystorageaccount.blob.core.windows.net"   # managed identity needs Storage Blob Data Contributor
  container: smux-files
  max_file_size: 100MB         # per file, in either direction   env: SANDBOX_MUX_MAX_FILE_SIZE
  max_user_total_size: 2GB     # everything one user has stored   env: SANDBOX_MUX_MAX_USER_STORAGE
  max_files_per_user: 500
  max_input_files_per_turn: 10
  max_output_files_per_turn: 20
  max_output_size_per_turn: 200MB   # archive size, including 512 bytes of header per file
  retention_days: 7            # env: SANDBOX_MUX_FILE_RETENTION_DAYS
  max_concurrent_transfers: 4  # whole files are held in memory while being moved

isolation:
  mode: unix_user              # unix_user | home_only (see README: home_only is NOT a security boundary)
  home_root: /home

agent:
  # argv of the program that runs a turn inside the sandbox. It receives the path
  # of the JSON request file as its last argument and prints one JSON object on stdout.
  command: ["python3", "/opt/agent/run_turn.py"]
  env: {}                      # non-secret environment passed to the agent process

auth:
  mode: entra                  # entra | dev (dev trusts the X-Dev-User header: never in production)
  tenant_id: "00000000-0000-0000-0000-000000000000"
  audience: "api://sandbox-mux"
  admin_oids: []               # object IDs allowed to call /v1/pool/status

# On-Behalf-Of: let the agent call downstream APIs as the signed-in user.
# Requires auth.mode: entra and isolation.mode: unix_user. The app registration needs the
# downstream API permissions (delegated) and admin or user consent.
obo:
  enabled: false
  client_id: "00000000-0000-0000-0000-000000000000"   # app registration behind auth.audience
  credential: secret           # secret (env OBO_CLIENT_SECRET) | certificate | managed_identity
  # certificate_path: /etc/sandbox-mux/obo.pem
  # certificate_thumbprint: "..."
  assertion_header: Authorization   # header carrying the user's token
  max_resources_per_turn: 3
  resources:                   # alias -> scopes. Callers request aliases, never raw scopes.
    graph: ["https://graph.microsoft.com/.default"]
    storage: ["https://storage.azure.com/user_impersonation"]

redis:
  key_prefix: "smux"
  # url: "redis://localhost:6379/0"
