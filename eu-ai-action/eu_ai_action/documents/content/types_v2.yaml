    - {name: evaluations, source: fact, key: evaluations}
    - {name: model_deployments, source: fact, key: modelDeployments}
    - {name: control_mapping_notes, source: human, label: {en: "Mapping of this evidence to Annex A controls"}}
  layout:
    - title: {en: "Evidence observed", es: "Evidencias observadas"}
      rows:
        - {label: {en: "Agent", es: "Agente"}, field: agent_name}
        - {label: {en: "Human oversight", es: "Supervisión humana"}, field: overseers}
        - {label: {en: "People with no recorded training", es: "Personas sin formación registrada"}, field: literacy_gaps}
