        - {label: {en: "Contract reference", es: "Referencia del contrato"}, field: contract_reference}
        - {label: {en: "Function supported", es: "Función soportada"}, field: function_supported}
        - {label: {en: "Provider identifier", es: "Identificador del proveedor"}, field: provider_identifier}
  basis:
    en: "Regulation (EU) 2022/2554 (DORA), Article 28(3)."
    es: "Reglamento (UE) 2022/2554 (DORA), artículo 28.3."

